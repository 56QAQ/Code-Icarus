# Builds and tests the kernel, builds the GDExtension for Linux / Windows / macOS and
# exports playable game builds as workflow artifacts.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      - name: Kernel tests
        run: ./build/tests/icarus_tests

  extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            scons: platform=linux arch=x86_64
          - name: windows
            os: ubuntu-24.04
            scons: platform=windows arch=x86_64 use_mingw=yes
          - name: macos
            os: macos-14
            scons: platform=macos arch=universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          python -m pip install scons
          if [ "${{ matrix.name }}" = "windows" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix
          fi
      - name: Build extension (release and debug)
        run: |
          cd gdext
          scons ${{ matrix.scons }} target=template_release -j4
          scons ${{ matrix.scons }} target=template_debug -j4
      - uses: actions/upload-artifact@v4
        with:
          name: gdext-${{ matrix.name }}
          path: game/bin/
          if-no-files-found: error

  export:
    needs: [kernel, extension]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gdext-*
          path: game/bin/
          merge-multiple: true
      - name: Godot and export templates
        run: |
          V=${GODOT_VERSION}-stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${V}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Import and smoke test
        run: |
          godot --headless --path game --import || true
          godot --headless --path game --script res://tests/smoke.gd
      - name: Export
        run: |
          mkdir -p build/export/windows build/export/linux build/export/macos
          godot --headless --path game --export-release "Windows Desktop" ../build/export/windows/CodeIcarus.exe
          godot --headless --path game --export-release "Linux" ../build/export/linux/CodeIcarus.x86_64
          godot --headless --path game --export-release "macOS" ../build/export/macos/CodeIcarus.zip || echo "macOS export failed"
          cp README.md build/export/windows/ build/export/linux/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: CodeIcarus-windows
          path: build/export/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: CodeIcarus-linux
          path: build/export/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: CodeIcarus-macos
          path: build/export/macos/
          if-no-files-found: warn
